services:
  - type: web
    name: khadamatak
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm run start
    healthCheckPath: /ar
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: MOLLIE_API_KEY
        sync: false
      - key: MOLLIE_WEBHOOK_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
